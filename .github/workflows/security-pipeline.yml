name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Run unit tests
        run: python -m pytest -v

      - name: Create reports directory
        run: mkdir -p reports

      - name: Bandit scan
        run: |
          bandit -r app/ -f json -o reports/bandit-report.json || true

      - name: Semgrep scan
        run: |
          semgrep scan --config security/semgrep/rules.yml \
            --json --output reports/semgrep-report.json app/

      - name: Dependency scan
        run: |
          pip-audit -r requirements.txt \
            -f json -o reports/dependency-report.json || true

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: vulnfinbot:latest
          format: json
          output: reports/trivy-report.json
          exit-code: "0"

      - name: Start Flask application
        run: |
          nohup python run.py > flask.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:5000/health

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -J zap-report.json \
            -I
            
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30